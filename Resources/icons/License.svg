<?xml version="1.0" standalone="no"?>
<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><style>
                .cad-stroke { stroke: #475569; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
                .cad-fill-white { fill: #FFFFFF; }
                .cad-fill-shade { fill: #CBD5E1; }
                .cad-fill-blue { fill: #3B82F6; }
                .cad-fill-blue-light { fill: #DBEAFE; }
            </style>
                    <!-- 1. The Document Body (Standard Isometric) -->
                    <!-- Thickness (Right/Bottom) -->
                    <path d="M22 6 L26 4 L26 24 L22 26" class="cad-fill-shade" stroke="none"/>
                    <!-- Main Face Background -->
                    <path d="M6 6 L22 6 L22 26 L6 26 Z" class="cad-fill-white" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/>
                    <!-- Outline for thickness -->
                    <path d="M22 6 L26 4 L26 24 L22 26" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/>
                    
                    <!-- 2. Smart Chip (Digital Auth Symbol) -->
                    <!-- Located at the top, looks like a SIM/Credit Card chip -->
                    <path d="M10 9 L18 9 L18 15 L10 15 Z" class="cad-fill-blue-light" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/>
                    <!-- Chip contact lines (Printed flat) -->
                    <path d="M10 12 L18 12" stroke="#3B82F6" stroke-width="1"/>
                    <path d="M14 9 L14 15" stroke="#3B82F6" stroke-width="1"/>
                    <circle cx="14" cy="12" r="1" class="cad-fill-blue" stroke="none"/>

                    <!-- 3. License Code / ID Area -->
                    <!-- Abstract representation of a License Key string or Barcode -->
                    <path d="M9 19 L19 19" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M9 22 L15 22" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
                    
                    <!-- 4. Validated Check/Status (Optional subtle accent) -->
                    <!-- A small blue corner tag or dot to show 'Active' -->
                    <path d="M20 20 L22 20 L22 22" fill="#3B82F6" stroke="none" opacity="0.8"/>

                </svg>