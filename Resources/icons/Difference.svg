<?xml version="1.0" standalone="no"?>
<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><style>
                .cad-stroke { stroke: #475569; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
                .cad-stroke-thin { stroke: #475569; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; fill: none; }
                .cad-fill-white { fill: #FFFFFF; }
                .cad-fill-shade { fill: #CBD5E1; }
                .cad-fill-blue { fill: #3B82F6; }
                .cad-fill-blue-light { fill: #DBEAFE; }
                .cad-accent-red { stroke: #EF4444; fill: none; }
                .cad-accent-orange { stroke: #F97316; fill: none; }
            </style>
                    <!-- Main Block (Gray) with cutout -->
                    <path d="M4 12 L12 8 L20 12 L20 24 L12 28 L4 24 Z" class="cad-fill-white" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/>
                    <path d="M12 8 L12 20 L4 24" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/>
                    <path d="M12 20 L20 24" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/>
                    <!-- Subtracting Block (Blue Ghost) intersecting -->
                    <path d="M16 6 L24 10 L24 20 L20 22" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="2 2"/>
                    <path d="M16 6 L12 8" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="2 2"/>
                    <!-- Cutout Face Highlight -->
                    <path d="M12 8 L16 6 L16 18 L12 20 Z" class="cad-fill-blue" fill-opacity="0.5" stroke="none"/>
                    <!-- Minus Sign -->
                    <line x1="24" y1="24" x2="28" y2="24" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
                </svg>