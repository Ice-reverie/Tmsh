<?xml version="1.0" standalone="no"?>
<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><style>
                .cad-stroke { stroke: #475569; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
                .cad-stroke-thin { stroke: #475569; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; fill: none; }
                .cad-fill-white { fill: #FFFFFF; }
                .cad-fill-shade { fill: #CBD5E1; }
                .cad-fill-blue { fill: #3B82F6; }
                .cad-fill-blue-light { fill: #DBEAFE; }
                .cad-accent-red { stroke: #EF4444; fill: none; }
                .cad-accent-orange { stroke: #F97316; fill: none; }
            </style>
                    <!-- Surface 1 -->
                    <path d="M4 10 L12 6 L12 24 L4 28 Z" class="cad-fill-white" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/>
                    <!-- Surface 2 -->
                    <path d="M20 6 L28 10 L28 28 L20 24 Z" class="cad-fill-white" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/>
                    <!-- The Gap Fill (Blue Band) -->
                    <path d="M12 6 L20 6 L20 24 L12 24 Z" class="cad-fill-blue" fill-opacity="0.7" stroke="none"/>
                    <!-- Stitching Arrow -->
                    <path d="M12 15 L20 15" stroke="#F97316" stroke-width="1.5" stroke-dasharray="2 1"/>
                    <path d="M14 13 L12 15 L14 17" stroke="#F97316" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M18 13 L20 15 L18 17" stroke="#F97316" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>